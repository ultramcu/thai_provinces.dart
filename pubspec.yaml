name: thai_provinces
description: >-
  Thailand administrative areas (province, district, subdistrict) with postal
  codes — offline lookup by official geocode, hierarchy, name search,
  autocomplete, validation and address resolution. Pure Dart, no dependencies.
version: 0.1.0
repository: https://github.com/ultramcu/thai_provinces.dart
homepage: https://github.com/ultramcu/thai_provinces.dart
issue_tracker: https://github.com/ultramcu/thai_provinces.dart/issues
topics:
  - thailand
  - address
  - geography
  - postal-code
  - i18n

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
